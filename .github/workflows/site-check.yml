name: AI OOTD site checks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  site-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate Wiki and HTML deck
        run: node scripts/validate-web-assets.mjs
